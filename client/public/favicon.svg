<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <!-- Ganesha Symbol -->
  <g fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10)">
    <!-- Crown (Mukut) -->
    <path d="M 90 25 C 90 15, 110 15, 110 25 Z" fill="#d4af37" fill-opacity="0.2" />
    <path d="M 85 25 L 115 25" stroke-width="2" />
    <path d="M 100 15 L 100 5" stroke-width="2" />
    <circle cx="100" cy="3" r="1.5" fill="#d4af37" />
    <!-- Ears -->
    <path d="M 85 30 C 65 30, 70 50, 88 48" /> <!-- Left Ear -->
    <path d="M 115 30 C 135 30, 130 50, 112 48" /> <!-- Right Ear -->
    <!-- Head / Face / Trunk -->
    <path d="M 92 32 C 92 45, 80 55, 95 68 C 102 75, 112 72, 112 65 C 112 60, 105 58, 102 62" /> <!-- Face and trunk curling right -->
    <!-- Eyes and Tilak -->
    <path d="M 100 28 L 100 38 M 97 33 L 103 33" stroke-width="1.5" /> <!-- Tilak -->
    <circle cx="93" cy="36" r="1" fill="#d4af37" />
    <circle cx="107" cy="36" r="1" fill="#d4af37" />
    <!-- Modak / Bowl -->
    <circle cx="114" cy="62" r="3.5" fill="#d4af37" fill-opacity="0.5" />
    <!-- Left Hand / Blessing -->
    <path d="M 82 45 C 75 48, 76 56, 84 54" />
  </g>

  <!-- Intertwined typography and text -->
  <g transform="translate(10, 85)">
    <!-- First 'S' (Swar) -->
    <path d="M 50 25 C 50 5, 25 5, 25 22 C 25 45, 52 40, 52 62 C 52 82, 28 82, 28 62" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round" />
    <!-- Second 'S' (Sadhana) -->
    <path d="M 68 65 C 68 45, 43 45, 43 62 C 43 85, 70 80, 70 102 C 70 122, 46 122, 46 102" fill="none" stroke="#f4ebd0" stroke-width="6" stroke-linecap="round" />
    
    <!-- "war" (Swar) -->
    <text x="56" y="42" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#d4af37" letter-spacing="1">war</text>
    <!-- "adhana" (Sadhana) -->
    <text x="74" y="82" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#f4ebd0" letter-spacing="1">adhana</text>

    <!-- ESTD. - 2001 -->
    <text x="100" y="115" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#d4af37" letter-spacing="3" text-anchor="middle">ESTD. - 2001</text>
  </g>
</svg>